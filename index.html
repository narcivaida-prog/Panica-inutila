<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Termene &amp; Documente</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#f4f5f3; --card:#ffffff; --border:#e2e0d8; --border-strong:#c9c7bd;
    --text:#232220; --text2:#68665f; --muted:#9a978c;
    --red-bg:#fcebeb; --red-text:#791f1f; --red-border:#e24b4a;
    --amber-bg:#faeeda; --amber-text:#633806; --amber-border:#ef9f27;
    --green-bg:#eaf3de; --green-text:#27500a; --green-border:#639922;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); padding:24px 16px 60px;
  }
  .wrap{max-width:720px; margin:0 auto;}
  h1{font-size:20px; font-weight:600; margin:0 0 4px;}
  .sub{color:var(--text2); font-size:13px; margin:0 0 20px;}

  .auth-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; max-width:360px; margin:60px auto;}
  .auth-card h2{font-size:16px; margin:0 0 16px;}
  .auth-card label{display:block; font-size:12px; color:var(--text2); margin:10px 0 4px;}
  .auth-card input{width:100%; padding:9px 10px; border:1px solid var(--border-strong); border-radius:8px; font-size:14px;}
  .auth-card button{width:100%; margin-top:14px;}
  .auth-msg{font-size:12px; margin-top:10px; color:var(--text2);}
  .auth-switch{font-size:12px; color:var(--text2); margin-top:14px; text-align:center;}
  .auth-switch a{color:var(--text); cursor:pointer; text-decoration:underline;}

  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .logout{font-size:12px; color:var(--text2); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0;}

  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px;}
  .stat{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px;}
  .stat .n{font-size:22px; font-weight:600;}
  .stat .l{font-size:12px; color:var(--text2);}
  .stat.red .n{color:var(--red-text);}
  .stat.amber .n{color:var(--amber-text);}
  .stat.green .n{color:var(--green-text);}

  .addbar{display:flex; gap:8px; margin-bottom:16px;}
  button.primary{
    background:var(--text); color:#fff; border:none; border-radius:var(--radius);
    padding:10px 16px; font-size:14px; font-weight:500; cursor:pointer;
  }
  button.primary:hover{opacity:.9;}
  button.ghost{
    background:transparent; border:1px solid var(--border-strong); border-radius:var(--radius);
    padding:8px 12px; font-size:13px; cursor:pointer; color:var(--text);
  }
  button.ghost:hover{background:#eceae2;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:20px;}
  label{display:block; font-size:12px; color:var(--text2); margin:10px 0 4px;}
  input[type=text], input[type=email], input[type=password], input[type=date], select, input[type=number]{
    width:100%; padding:9px 10px; border:1px solid var(--border-strong); border-radius:8px;
    font-size:14px; background:#fff; color:var(--text);
  }
  .row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .formbtns{display:flex; gap:8px; margin-top:14px;}

  .list{display:flex; flex-direction:column; gap:8px;}
  .item{
    display:flex; align-items:center; gap:12px; background:var(--card);
    border:1px solid var(--border); border-left:4px solid var(--muted);
    border-radius:var(--radius); padding:12px 14px;
  }
  .item.red{border-left-color:var(--red-border);}
  .item.amber{border-left-color:var(--amber-border);}
  .item.green{border-left-color:var(--green-border);}
  .item .info{flex:1; min-width:0;}
  .item .name{font-weight:500; font-size:14px;}
  .item .meta{font-size:12px; color:var(--text2); margin-top:2px;}
  .badge{font-size:11px; font-weight:600; padding:4px 9px; border-radius:20px; white-space:nowrap;}
  .badge.red{background:var(--red-bg); color:var(--red-text);}
  .badge.amber{background:var(--amber-bg); color:var(--amber-text);}
  .badge.green{background:var(--green-bg); color:var(--green-text);}
  .item .actions{display:flex; gap:6px;}
  .iconbtn{border:none; background:transparent; cursor:pointer; color:var(--muted); font-size:16px; padding:4px 6px; border-radius:6px;}
  .iconbtn:hover{background:#eceae2; color:var(--text);}
  .empty{text-align:center; color:var(--muted); font-size:14px; padding:40px 0;}
  .hidden{display:none;}
</style>
</head>
<body>

<!-- ============ CONFIGUREAZĂ AICI ============ -->

  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95d3Fkd2FpeXlyZXZ3dmlrZ3NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NzM2MzcsImV4cCI6MjEwMTA0OTYzN30.ansz6Q_qZhC4rdv-SwTwId-piZkq-LY4TFVsHgtnH_s';
</script>
<!-- ============================================ -->

<div id="auth-screen" class="wrap">
  <div class="auth-card">
    <h2 id="auth-title">Conectează-te</h2>
    <label>Email</label>
    <input type="email" id="auth-email" placeholder="nume@exemplu.ro">
    <label>Parolă</label>
    <input type="password" id="auth-password" placeholder="minim 6 caractere">
    <button class="primary" id="auth-submit">Conectare</button>
    <div class="auth-msg" id="auth-msg"></div>
    <div class="auth-switch">
      <span id="auth-switch-text">Nu ai cont? <a id="auth-switch-link">Creează unul</a></span>
    </div>
  </div>
</div>

<div id="app-screen" class="wrap hidden">
  <div class="topbar">
    <h1>Termene &amp; Documente</h1>
    <button class="logout" id="btn-logout">Deconectare</button>
  </div>
  <p class="sub">Vei primi email automat când un document e aproape de expirare.</p>

  <div class="stats">
    <div class="stat red"><div class="n" id="stat-expired">0</div><div class="l">expirate</div></div>
    <div class="stat amber"><div class="n" id="stat-soon">0</div><div class="l">sub prag</div></div>
    <div class="stat green"><div class="n" id="stat-ok">0</div><div class="l">în regulă</div></div>
  </div>

  <div class="addbar">
    <button class="primary" id="btn-open-form" style="flex:1;">+ Adaugă document</button>
  </div>

  <div class="card hidden" id="form-card">
    <label>Denumire</label>
    <input type="text" id="f-name" placeholder="ex: RCA Dacia Duster">
    <div class="row">
      <div>
        <label>Categorie</label>
        <select id="f-category">
          <option value="RCA">RCA (asigurare auto)</option>
          <option value="CASCO">CASCO</option>
          <option value="Rovinietă">Rovinietă</option>
          <option value="ITP">ITP</option>
          <option value="CI">Carte de identitate / Buletin</option>
          <option value="Pașaport">Pașaport</option>
          <option value="Permis">Permis de conducere</option>
          <option value="Card">Card bancar</option>
          <option value="Altul">Altul</option>
        </select>
      </div>
      <div>
        <label>Data expirării</label>
        <input type="date" id="f-date">
      </div>
    </div>
    <label>Alertă cu câte zile înainte</label>
    <input type="number" id="f-reminder" value="30" min="0">
    <div class="formbtns">
      <button class="primary" id="btn-save">Salvează</button>
      <button class="ghost" id="btn-cancel">Anulează</button>
    </div>
  </div>

  <div class="list" id="list"></div>
  <div class="empty hidden" id="empty-state">Niciun document adăugat încă.</div>
</div>

<script>
const { createClient } = supabase;
const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let items = [];
let editingId = null;
let isSignup = false;

const $ = id => document.getElementById(id);

// ---------- AUTH ----------

function toggleAuthMode(){
  isSignup = !isSignup;
  $('auth-title').textContent = isSignup ? 'Creează cont' : 'Conectează-te';
  $('auth-submit').textContent = isSignup ? 'Creează cont' : 'Conectare';
  $('auth-switch-text').innerHTML = isSignup
    ? 'Ai deja cont? <a id="auth-switch-link">Conectează-te</a>'
    : 'Nu ai cont? <a id="auth-switch-link">Creează unul</a>';
  $('auth-switch-link').addEventListener('click', toggleAuthMode);
}
$('auth-switch-link').addEventListener('click', toggleAuthMode);

$('auth-submit').addEventListener('click', async () => {
  const email = $('auth-email').value.trim();
  const password = $('auth-password').value;
  $('auth-msg').textContent = '';

  if(!email || !password){
    $('auth-msg').textContent = 'Completează email și parolă.';
    return;
  }

  const fn = isSignup ? 'signUp' : 'signInWithPassword';
  const { error } = await client.auth[fn]({ email, password });

  if(error){
    $('auth-msg').textContent = error.message;
    return;
  }

  if(isSignup){
    $('auth-msg').textContent = 'Cont creat. Verifică-ți emailul dacă ți se cere confirmare, apoi conectează-te.';
  } else {
    await checkSession();
  }
});

$('btn-logout').addEventListener('click', async () => {
  await client.auth.signOut();
  location.reload();
});

async function checkSession(){
  const { data: { session } } = await client.auth.getSession();
  if(session){
    $('auth-screen').classList.add('hidden');
    $('app-screen').classList.remove('hidden');
    await loadDocuments();
  } else {
    $('auth-screen').classList.remove('hidden');
    $('app-screen').classList.add('hidden');
  }
}

// ---------- DATA ----------

async function loadDocuments(){
  const { data, error } = await client.from('documents').select('*').order('expiry_date');
  if(error){ console.error(error); return; }
  items = data;
  render();
}

function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr); target.setHours(0,0,0,0);
  return Math.round((target - today) / 86400000);
}

function statusOf(item){
  const days = daysUntil(item.expiry_date);
  if(days < 0) return 'red';
  if(days <= item.reminder_days) return 'amber';
  return 'green';
}

function metaText(days){
  if(days < 0) return `Expirat de ${Math.abs(days)} zile`;
  if(days === 0) return 'Expiră astăzi';
  return `Expiră în ${days} zile`;
}

function render(){
  const sorted = [...items].sort((a,b) => daysUntil(a.expiry_date) - daysUntil(b.expiry_date));
  const list = $('list');
  list.innerHTML = '';
  let expired = 0, soon = 0, ok = 0;

  $('empty-state').classList.toggle('hidden', sorted.length !== 0);

  sorted.forEach(item => {
    const days = daysUntil(item.expiry_date);
    const status = statusOf(item);
    if(status === 'red') expired++;
    else if(status === 'amber') soon++;
    else ok++;

    const div = document.createElement('div');
    div.className = 'item ' + status;
    div.innerHTML = `
      <div class="info">
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="meta">${escapeHtml(item.category)} · ${formatDate(item.expiry_date)} · ${metaText(days)}</div>
      </div>
      <span class="badge ${status}">${status === 'red' ? 'Expirat' : status === 'amber' ? 'Curând' : 'OK'}</span>
      <div class="actions">
        <button class="iconbtn" data-edit="${item.id}" title="Editează">✎</button>
        <button class="iconbtn" data-del="${item.id}" title="Șterge">✕</button>
      </div>`;
    list.appendChild(div);
  });

  $('stat-expired').textContent = expired;
  $('stat-soon').textContent = soon;
  $('stat-ok').textContent = ok;

  list.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => openForm(btn.dataset.edit)));
  list.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => removeItem(btn.dataset.del)));
}

function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
function formatDate(dateStr){ return new Date(dateStr).toLocaleDateString('ro-RO', {day:'2-digit', month:'2-digit', year:'numeric'}); }

function openForm(id){
  editingId = id || null;
  $('form-card').classList.remove('hidden');
  if(id){
    const item = items.find(i => i.id === id);
    $('f-name').value = item.name;
    $('f-category').value = item.category;
    $('f-date').value = item.expiry_date;
    $('f-reminder').value = item.reminder_days;
  } else {
    $('f-name').value = '';
    $('f-category').value = 'RCA';
    $('f-date').value = '';
    $('f-reminder').value = 30;
  }
  $('f-name').focus();
}

function closeForm(){ $('form-card').classList.add('hidden'); editingId = null; }

async function removeItem(id){
  const { error } = await client.from('documents').delete().eq('id', id);
  if(error){ alert(error.message); return; }
  await loadDocuments();
}

$('btn-open-form').addEventListener('click', () => openForm(null));
$('btn-cancel').addEventListener('click', closeForm);

$('btn-save').addEventListener('click', async () => {
  const name = $('f-name').value.trim();
  const category = $('f-category').value;
  const expiry_date = $('f-date').value;
  const reminder_days = parseInt($('f-reminder').value, 10) || 0;

  if(!name || !expiry_date){ alert('Completează denumirea și data expirării.'); return; }

  if(editingId){
    const { error } = await client.from('documents').update({ name, category, expiry_date, reminder_days }).eq('id', editingId);
    if(error){ alert(error.message); return; }
  } else {
    const { data: { user } } = await client.auth.getUser();
    const { error } = await client.from('documents').insert({ name, category, expiry_date, reminder_days, user_id: user.id });
    if(error){ alert(error.message); return; }
  }

  closeForm();
  await loadDocuments();
});

checkSession();
</script>
</body>
</html>
